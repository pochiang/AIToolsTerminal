<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>AI Tools Terminal</title>
  <link rel="icon" href="../../assets/icon.png" />
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span>AI Tools Terminal</span>
    </div>
    <div class="usage" id="usage"></div>
    <button class="icon-btn" id="refresh-usage" title="重新整理用量">⟳</button>
  </header>

  <div class="body">
    <aside class="git-panel" id="git-panel" hidden>
      <div class="panel-head">
        <h3>Git</h3>
        <span class="git-branch" id="git-branch"></span>
        <button class="mini-btn" id="git-refresh" title="重新整理">⟳</button>
        <button class="mini-btn" id="git-close" title="收起">‹</button>
      </div>
      <div class="git-actions">
        <button class="git-act" id="git-pull" title="git pull">↓ 拉取<span class="n" id="git-behind"></span></button>
        <button class="git-act" id="git-push" title="git push">↑ 推送<span class="n" id="git-ahead"></span></button>
      </div>
      <div class="git-section" id="git-changes"></div>
      <div class="git-commit-box" id="git-commit-box">
        <textarea id="git-message" rows="2" placeholder="提交訊息（Ctrl+Enter 提交）"></textarea>
        <button class="git-commit-btn" id="git-commit">✓ 提交</button>
      </div>
      <div class="git-section git-log" id="git-log"></div>
    </aside>

    <main class="workspace">
      <div class="toolbar">
        <button class="git-toggle" id="git-toggle" title="顯示 Git 面板" hidden>⑂ Git</button>
        <div class="dir-wrap">
          <button class="dir-btn" id="dir-btn" title="新對話的工作資料夾">
            <span class="dir-icon">📁</span><span id="dir-label"></span><span class="caret">▾</span>
          </button>
          <div class="dir-menu" id="dir-menu" hidden></div>
        </div>
        <button class="launch claude" data-kind="claude"><span class="plus">＋</span>Claude Code</button>
        <button class="launch codex" data-kind="codex"><span class="plus">＋</span>Codex</button>
      </div>

      <nav class="tabs" id="tabs"></nav>

      <section class="terms" id="terms">
        <div class="viewer" id="viewer" tabindex="-1" hidden>
          <div class="viewer-head">
            <div class="viewer-title" id="viewer-title"></div>
            <button class="mini-btn" id="viewer-close" title="關閉（Esc）">✕</button>
          </div>
          <div class="viewer-body" id="viewer-body"></div>
        </div>
        <div class="empty" id="empty">
          <h2>開啟新對話</h2>
          <p>在 <code id="empty-dir"></code> 啟動</p>
          <div class="empty-actions">
            <button class="big-launch claude" data-kind="claude">
              <span class="big-icon">✻</span>
              <strong>Claude Code</strong>
              <small>Anthropic</small>
            </button>
            <button class="big-launch codex" data-kind="codex">
              <span class="big-icon">◎</span>
              <strong>Codex</strong>
              <small>OpenAI</small>
            </button>
          </div>
        </div>
      </section>
    </main>

    <aside class="status-panel">
      <div class="panel-head">
        <h3>工作狀況</h3>
        <button class="collab-btn" id="collab-btn" title="AI 協作設定"></button>
        <div class="collab-menu" id="collab-menu" hidden>
          <label class="switch-row">
            <span>允許 AI 互相詢問</span>
            <input type="checkbox" role="switch" class="toggle" id="collab-enabled" />
          </label>
          <p class="hint">Claude Code 與 Codex 可用 <code>ask_session</code> 把問題送進另一個對話並取回回覆。反問正在等自己的對話一律禁止。</p>
          <label class="num-row">每回合最多詢問<input type="number" id="collab-asks" min="1" max="20" />次</label>
          <label class="num-row">最多轉介<input type="number" id="collab-depth" min="1" max="5" />層</label>
          <label class="num-row">等待逾時<input type="number" id="collab-timeout" min="1" max="60" />分鐘</label>
          <p class="hint">「回合」從你在該對話按下 Enter 起算；轉介層數 1 = 只能直接詢問，對方不能再轉問別人。</p>
          <button class="stop-btn" id="collab-stop">停止所有進行中的協作</button>
        </div>
      </div>
      <div class="status-groups" id="status-groups"></div>
    </aside>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
